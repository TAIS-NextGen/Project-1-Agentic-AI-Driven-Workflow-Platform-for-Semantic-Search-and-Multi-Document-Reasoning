[project]
name = "sympact-backend"
version = "0.1.0"
description = "Sympact Agentic Workflow Platform — Backend Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.0.0",
    "dateparser[calendars]>=1.4.1",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "PyMuPDF>=1.24.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "easyocr>=1.7.0",
]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
]
vector = [
    "qdrant-client>=1.9.0",
    "chromadb>=0.5.0",
]
structure = [
    "unstructured[image,pdf]>=0.16.0",
]
translation = [
    "argostranslate>=1.9.6",
]
conversion = []
watermark = [
    "PyMuPDF>=1.24.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
]
all = [
    "sympact-backend[dev,ocr,llm,vector,structure,translation,conversion,watermark]",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
